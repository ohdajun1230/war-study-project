<body>

    <nav class="nav">

            <div class="nav-links">

    <header class="page-header fade-in-scroll">

    </header>

    <main class="section fade-in-scroll">
        <div class="content-box">
            <div style="margin-bottom: 30px; display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 24px;">📂</span>
                <h3 style="margin: 0;">Download Files</h3>
            </div>

            <table>
                <thead>
                    <tr>
                        <th width="10%">No.</th>
                        <th width="50%">자료 제목</th>
                        <th width="20%">파일 형식</th>
                        <th width="20%">다운로드</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td style="font-weight: 600;">졸업 프로젝트 최종 보고서</td>
                        <td><span style="background:#eee; padding:4px 8px; border-radius:4px; font-size:12px;">PDF</span></td>
                        <td><a href="#" style="color:#3182f6; font-weight:700;">Download ↓</a></td>

                    <tr>
                        <td>2</td>

    <footer class="footer">
        <h3>WAR & PEACE</h3>
        <p>2025 [다준] 졸업 프로젝트 Archive.</p>
    </footer>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade-in-scroll').forEach(el => observer.observe(el));
    </script>
