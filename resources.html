<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자료실</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><style>text{filter:grayscale(100%);}</style><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
</head>
<body>

    <nav class="nav">
        <div class="nav-container">
            <a href="index.html" class="logo">WAR & PEACE</a>
            <div class="nav-links">
                <a href="about.html">소개</a>
                <a href="project.html">프로젝트</a>
                <a href="gallery.html">갤러리</a>
                <a href="map.html">지도</a>
                <a href="resources.html">자료실</a>
                <a href="guestbook.html">방명록</a>
            </div>
        </div>
    </nav>

    <header class="page-header fade-in-scroll">
        <h1 class="page-title">Resources Archive</h1>
        <p class="page-desc">프로젝트 진행 과정에서 작성된 주요 문서와<br>발표 자료를 공유합니다.</p>
    </header>

    <main class="section fade-in-scroll">
        <div class="content-box">
            <div style="margin-bottom: 30px; display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 24px;">📂</span>
                <h3 style="margin: 0;">Download Files</h3>
            </div>

            <div class="resource-list">
                
                <div class="resource-item">
                    <div class="res-info">
                        <span class="res-number">01</span>
                        <div class="res-title-group">
                            <span class="res-title">군산 평화 박물관 답사 대본</span>
                            <div><span class="res-badge badge-hwp">HWP</span></div>
                        </div>
                    </div>
                    <a href="files/gunsanpeacemuseum_script.hwp" download class="res-btn">
                        Download ↓
                    </a>
                </div>

                <div class="resource-item">
                    <div class="res-info">
                        <span class="res-number">02</span>
                        <div class="res-title-group">
                            <span class="res-title">구술공유회 발표 대본</span>
                            <div><span class="res-badge badge-hwp">HWP</span></div>
                        </div>
                    </div>
                    <a href="files/interviewmeeting_script.hwp" download class="res-btn">
                        Download ↓
                    </a>
                </div>

                <div class="resource-item">
                    <div class="res-info">
                        <span class="res-number">03</span>
                        <div class="res-title-group">
                            <span class="res-title">구술공유회 발표 자료 (PPT)</span>
                            <div><span class="res-badge badge-pdf">PDF</span></div>
                        </div>
                    </div>
                    <a href="files/interviewmeetingppt.pdf" download class="res-btn">
                        Download ↓
                    </a>
                </div>

            </div>
            </div>
    </main>

    <footer class="footer">
        <h3>WAR & PEACE</h3>
        <p>2025 다준 졸업 프로젝트 Archive.</p>
    </footer>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade-in-scroll').forEach(el => observer.observe(el));
    </script>

</body>
</html>
