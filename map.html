<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현장 방문 지도</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 지도 전용 반응형 스타일 */
        .map-responsive {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 비율 유지 */
            height: 0;
            overflow: hidden;
            border-radius: 20px; /* 둥근 모서리 */
            border: 1px solid #e5e8eb;
        }
        .map-responsive iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <nav class="nav">
        <div class="nav-container">
            <a href="index.html" class="logo">WAR & PEACE</a>
            <div class="nav-links">
                <a href="about.html">소개</a>
                <a href="project.html">프로젝트</a>
                <a href="gallery.html">갤러리</a>
                <a href="map.html">지도</a>
                <a href="resources.html">자료실</a>
                <a href="guestbook.html">방명록</a>
            </div>
        </div>
    </nav>

    <header class="page-header fade-in-scroll">
        <h1 class="page-title">Location Map</h1>
        <p class="page-desc">우리가 직접 발로 뛴 역사의 현장들을 지도에 담았습니다.<br>용산에서 철원까지, 그 여정을 확인해보세요.</p>
    </header>

    <main class="section fade-in-scroll">
        <div class="content-box">
            <div style="margin-bottom: 30px; display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 24px;">🗺️</span>
                <h3 style="margin: 0;">Visit Map</h3>
            </div>
            
            <div class="map-responsive">
                <iframe src="https://www.google.com/maps/d/u/1/embed?mid=1uxoYucHOjHa7D2nJfh6xxauhjVvo9n4&ehbc=2E312F" width="640" height="480"></iframe>
            </div>

            <p style="margin-top: 20px; color: #888; font-size: 14px; text-align: center;">
                * 핀을 클릭하면 해당 장소의 상세 정보를 볼 수 있습니다.
            </p>
        </div>
    </main>

    <footer class="footer">
        <h3>WAR & PEACE</h3>
        <p>2025 [다준] 졸업 프로젝트 Archive.</p>
    </footer>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade-in-scroll').forEach(el => observer.observe(el));
    </script>

</body>
</html>
