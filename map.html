    <style>
        /* 지도를 화면 크기에 맞춰 꽉 차게 보여주는 스타일 */
        .map-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 75%; /* 지도의 세로 비율 (4:3 비율) */
            border-radius: 20px; /* 둥근 모서리 */
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #eee;
        }
        
        .map-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

    <main class="container">
        
        <div class="apple-card fade-in delay-3">
            <h2>🗺️ Visit Map</h2>
            <p style="margin-bottom: 30px;">
                핀을 클릭하면 해당 장소에 대한 간략한 설명과 사진을 볼 수 있습니다.<br>
                지도를 확대/축소하여 이동 경로를 확인해보세요.
            </p>

            <div class="map-container">
                <iframe src="<iframe src="https://www.google.com/maps/d/u/1/embed?mid=1uxoYucHOjHa7D2nJfh6xxauhjVvo9n4&ehbc=2E312F&noprof=1" width="640" height="480"></iframe>
