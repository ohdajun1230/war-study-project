<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>현장 갤러리</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-container">
            <a href="index.html" class="logo">WAR & PEACE</a>
            <div class="nav-links">
                <a href="about.html">소개</a>
                <a href="project.html">프로젝트</a>
                <a href="gallery.html">갤러리</a>
                <a href="map.html">지도</a>
                <a href="resources.html">자료실</a>
                <a href="guestbook.html">방명록</a>
            </div>
        </div>
    </nav>

    <header class="page-header fade-in-scroll">
        <h1 class="page-title">Photo Gallery</h1>
        <p class="page-desc">현장에서 직접 촬영한 생생한 기록들입니다.</p>
    </header>

    <main class="section">
        <div class="bento-grid fade-in-scroll">
            <div class="card">
                <img src="images/photo1.jpg" style="width:100%; height:200px; object-fit:cover; border-radius:12px; margin-bottom:15px;">
                <h3>용산 전쟁기념관</h3>
                <p>입구의 조형물</p>
            </div>
            <div class="card">
                <img src="images/photo2.jpg" style="width:100%; height:200px; object-fit:cover; border-radius:12px; margin-bottom:15px;">
                <h3>철원 노동당사</h3>
                <p>역사의 상처</p>
            </div>
            <div class="card">
                <img src="images/photo3.jpg" style="width:100%; height:200px; object-fit:cover; border-radius:12px; margin-bottom:15px;">
                <h3>DMZ 철조망</h3>
                <p>분단의 현실</p>
            </div>
        </div>
    </main>
    <footer class="footer"><p>2025 [다준] 졸업 프로젝트.</p></footer>
    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade-in-scroll').forEach(el => observer.observe(el));
    </script>
</body>
</html>
