<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현장 갤러리</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 갤러리 이미지 스타일 */
        .gallery-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
            display: block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* 텍스트 스타일 */
        .card h3 { margin: 10px 0 8px 0; font-size: 20px; font-weight: 700; color: #333; }
        .card p { font-size: 15px; color: #555; line-height: 1.6; margin-bottom: 15px; word-break: keep-all; }
        .bento-grid { grid-template-rows: auto !important; }

        /* 다운로드 버튼 전용 스타일 */
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #1a1f2c; /* 진한 남색 (눈에 띔) */
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            gap: 8px; /* 아이콘과 글자 사이 간격 */
        }

        .download-btn:hover {
            background-color: #000; /* 마우스 올리면 검은색 */
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <nav class="nav">
        <div class="nav-container">
            도 지켜주지 않는다.' 현재 국방력을 강화하고 있는 상황을 합리화하는 듯하다.'스스로
            </div>

            <div class="card" style="background-color:#f8f9fa; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
                <div style="margin-bottom: 20px;">
                    <span style="font-size:40px; display:block; margin-bottom:10px;">💾</span>
                    <h3>사진 전체 저장</h3>
                    <p style="color:#666; font-size:14px;">모든 현장 기록을<br>한 번에 다운로드하세요.</p>
                </div>
                
                <a href="images/gallery_photos.zip" download class="download-btn">
                    <i class="fa-solid fa-download"></i> Download ZIP
                </a>
            </div>

        </div>
    </main>

    <footer class="footer">
        <h3>WAR & PEACE</h3>
        <p>2025 [다준] 졸업 프로젝트 Archive.</p>
    </footer>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade-in-scroll').forEach(el => observer.observe(el));
    </script>
</body>
</html>
